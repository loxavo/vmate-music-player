<svg width="512" height="512" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="loxRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D85B73"/>
      <stop offset="1" stop-color="#7BE495"/>
    </linearGradient>
    <linearGradient id="loxL" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#D85B73"/>
      <stop offset="0.55" stop-color="#b8708a"/>
      <stop offset="1" stop-color="#7BE495"/>
    </linearGradient>
    <linearGradient id="loxSpark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7BE495"/>
      <stop offset="1" stop-color="#9ff0b6"/>
    </linearGradient>
  </defs>
  <!-- squircle base -->
  <rect width="200" height="200" rx="46" fill="#08080a"/>
  <rect x="5" y="5" width="190" height="190" rx="46" fill="none" stroke="url(#loxRing)" stroke-width="3"/>
  <!-- L monogram: stem + foot, joined -->
  <rect x="74" y="50" width="36" height="100" rx="18" fill="url(#loxL)"/>
  <rect x="74" y="122" width="74" height="30" rx="15" fill="url(#loxL)"/>
  <!-- creative spark accent (studios) -->
  <path d="M152 44 L157 58 L171 63 L157 68 L152 82 L147 68 L133 63 L147 58 Z" fill="url(#loxSpark)"/>
  <circle cx="158" cy="120" r="6" fill="#7BE495" opacity="0.85"/>
